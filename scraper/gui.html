<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한강라면 매출 봇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#161616;--panel:#1E1E1E;--card:#242427;--chip:#26262C;--hover:#3C3C48;
    --text:#ECECEC;--muted:#8A8A95;--line:#2C2C30;--ok:#3FBF6A;--stop:#E0685E;--acc:#5BA8F0;--accent:#E8452C;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh;padding:14px 16px;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between}
  .title{font-size:16px;font-weight:600;color:var(--acc)}
  .botstate{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)}
  .botbar{display:flex;gap:8px}
  .bigbtn{flex:1;padding:9px;border:none;border-radius:6px;background:var(--chip);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
  .bigbtn:hover{background:var(--hover)}
  .bigbtn:disabled{color:var(--muted);background:var(--chip)}
  .bigbtn.go{color:var(--ok)} .bigbtn.stop{color:var(--stop)}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--text);border-bottom-color:var(--acc)}
  .page{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  .hidden{display:none!important}
  .logbox{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-radius:8px;padding:10px 12px;font-family:'Consolas',monospace;font-size:12px;line-height:1.7;white-space:pre-wrap}
  .logbox::-webkit-scrollbar,.slist::-webkit-scrollbar{width:8px}
  .logbox::-webkit-scrollbar-thumb,.slist::-webkit-scrollbar-thumb{background:var(--hover);border-radius:4px}
  .hint{font-size:10px;color:var(--muted)}
  select,input{font-family:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px}
  .srow{display:flex;gap:8px;align-items:center}
  .warn{background:#3A2A20;color:#F0A93B;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5}
  .gr{display:grid;grid-template-columns:44px minmax(0,1fr) 56px 66px 46px;gap:8px;align-items:center}
  .hd{padding:0 10px 6px;font-size:11px;color:var(--muted)}
  .slist{flex:1;min-height:0;overflow-y:auto;background:#161616;border-radius:8px;padding:2px 10px}
  .cell{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 6px;color:var(--text);font-size:13px}
  .cell.ch{border-color:var(--accent);color:var(--accent)}
  .delbtn{background:none;border:1px solid #3A2A2A;color:var(--stop);border-radius:6px;padding:6px 0;font-size:12px;cursor:pointer;font-family:inherit}
  .delrow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;opacity:.55}
  .savebar{display:flex;align-items:center;gap:8px}
  .save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .save:disabled{background:#3A3F4A;color:var(--muted)}
  .add{width:100%;background:var(--card);border:1px dashed #3C3C48;color:#8AC0F5;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="title">한강라면 매출 봇</span>
    <span class="botstate"><span class="dot" id="dot"></span><span id="botstate">정지</span></span>
  </header>
  <div class="botbar">
    <button class="bigbtn go" id="btnStart" onclick="botStart()">▶ 시작</button>
    <button class="bigbtn stop" id="btnStop" onclick="botStop()" disabled>■ 정지</button>
    <button class="bigbtn" id="btnNow" onclick="runNow()">⟳ 지금 수집</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="log" onclick="switchTab('log')">수집 로그</div>
    <div class="tab" data-t="stock" onclick="switchTab('stock')">재고 수정</div>
  </div>

  <div class="page" id="page-log">
    <div class="logbox" id="logbox"></div>
    <div class="hint">매출·재고는 폰에서 봐요 · 창 닫으면(X) 봇 종료 · 최소화(_)는 작업표시줄</div>
  </div>

  <div class="page hidden" id="page-stock">
    <div class="srow">
      <select id="machSel" style="flex:1" onchange="loadStock(false)"></select>
      <button class="bigbtn" style="flex:0 0 auto" onclick="loadStock(true)">불러오기</button>
    </div>
    <div class="warn" id="swarn">저장하면 실제 기계에 반영돼요. 처음엔 1개만 바꿔서 확인하세요.</div>
    <div class="gr hd"><span style="text-align:center">순서</span><span>상품명</span><span style="text-align:center">수량</span><span style="text-align:center">가격</span><span></span></div>
    <div class="slist" id="slist"><div style="padding:20px;text-align:center;color:var(--muted)">불러오기를 누르세요</div></div>
    <button class="add" onclick="addRow()">＋ 상품 추가</button>
    <div class="savebar">
      <span id="scnt" style="flex:1;font-size:12px;color:var(--muted)">바뀐 항목 0개</span>
      <button class="save" id="saveBtn" disabled onclick="saveStock()">저장</button>
    </div>
  </div>
</div>
<script>
const MACH=["라면1","라면2","냉동","냉장","슬림"];
const OPENER={"냉동":1,"냉장":1};
let rows=[], orig="";
const $=id=>document.getElementById(id);
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  $('page-log').classList.toggle('hidden',t!=='log');
  $('page-stock').classList.toggle('hidden',t!=='stock');
  if(t==='stock' && !$('machSel').dataset.filled){ $('machSel').innerHTML=MACH.map(m=>`<option>${m}</option>`).join(''); $('machSel').dataset.filled='1'; loadStock(false); }
}
async function botStart(){try{await pywebview.api.bot_start();}catch(e){}}
async function botStop(){try{await pywebview.api.bot_stop();}catch(e){}}
async function runNow(){const b=$('btnNow');b.disabled=true;b.textContent='수집 중…';try{await pywebview.api.run_now();}catch(e){}setTimeout(()=>{b.disabled=false;b.textContent='⟳ 지금 수집';},1500);}
function pushLog(l){
  const b=$('logbox');
  const line=document.createElement('div');
  let color='#ECECEC';
  if(/(오류|실패|✗|error)/i.test(l)) color='#E0685E';
  else if(/(✔|성공|반영됨|완료|저장됨)/.test(l)) color='#3FBF6A';
  else if(/(주의|경고|없음|건너뜀|확인)/.test(l)) color='#F0A93B';
  line.style.color=color;
  line.textContent=l;
  b.appendChild(line); b.scrollTop=b.scrollHeight;
}
function setBotState(on){$('dot').classList.toggle('on',on);$('botstate').textContent=on?'수집 중':'정지';$('btnStart').disabled=on;$('btnStop').disabled=!on;}
function setStatus(s){}

async function loadStock(fresh){
  const m=$('machSel').value;
  $('slist').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">'+(fresh?'기계에서 읽는 중…':'불러오는 중…')+'</div>';
  let all={};
  try{
    all = fresh ? await pywebview.api.refresh_stock() : await pywebview.api.get_stock();
  }catch(e){
    pushLog('재고 불러오기 오류: '+(e&&e.message?e.message:e));
    $('slist').innerHTML='<div style="padding:20px;text-align:center;color:var(--stop)">불러오기 오류 — 로그 탭 확인</div>';
    return;
  }
  if(!all || typeof all!=='object'){ all={}; }
  const items=(all[m]||[]);
  pushLog('['+m+'] 재고 '+items.length+'개 불러옴'+(fresh?' (새로 읽음)':''));
  rows=items.map((it,i)=>({o:(it.order!=null&&it.order!==''?String(it.order):String(i+1)),n:it.product,q:it.qty,p:(it.price!=null?it.price:''),oldName:it.product,del:false,isNew:false}));
  orig=JSON.stringify(rows);
  $('swarn').textContent = OPENER[m] ? "오프너 기계예요. ＋추가는 로봇이 [상품 입고 → 재고수정] 2단계를 자동 처리해요. 처음엔 1개만 테스트하세요." : "저장하면 실제 기계에 반영돼요. 처음엔 1개만 바꿔서 확인하세요.";
  render();
}
function cell(v,k,i,ta){return `<input value="${v==null?'':v}" data-i="${i}" data-k="${k}" class="cell" style="text-align:${ta}" oninput="onEdit(this)">`;}
function render(){
  if(!rows.length){ $('slist').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">상품이 없어요. 불러오기를 누르거나 ＋추가로 만드세요.</div>'; count(); return; }
  $('slist').innerHTML=rows.map((r,i)=>{
    if(r.del) return `<div class="delrow"><span style="color:var(--stop);text-decoration:line-through;font-size:13px">${r.n} · 삭제 예정</span><button class="delbtn" style="border-color:var(--line);color:var(--acc)" onclick="undoDel(${i})">되돌리기</button></div>`;
    return `<div class="gr" style="padding:5px 0;border-top:.5px solid #242427">${cell(r.o,'o',i,'center')}${cell(r.n,'n',i,'left')}${cell(r.q,'q',i,'center')}${cell(r.p,'p',i,'right')}<button class="delbtn" onclick="delRow(${i})">삭제</button></div>`;
  }).join('');
  count();
}
function onEdit(inp){rows[+inp.dataset.i][inp.dataset.k]=inp.value;inp.classList.add('ch');count();}
function delRow(i){rows[i].del=true;render();}
function undoDel(i){rows[i].del=false;render();}
function addRow(){rows.push({o:String(rows.length+1),n:"",q:0,p:0,oldName:null,del:false,isNew:true});render();}
function changes(){
  const o=JSON.parse(orig||"[]"); const out=[];
  rows.forEach((r,i)=>{
    if(r.isNew && !r.del){ if((r.n||'').trim()) out.push({action:'add',order:r.o,name:r.n,qty:r.q,price:r.p}); return; }
    if(r.del && !r.isNew){ out.push({action:'delete',oldName:r.oldName}); return; }
    const b=o[i]; if(b && (b.n!==r.n||''+b.q!==''+r.q||''+b.p!==''+r.p||''+b.o!==''+r.o)) out.push({action:'update',oldName:r.oldName,order:r.o,name:r.n,qty:r.q,price:r.p});
  });
  return out;
}
function count(){const n=changes().length;$('scnt').textContent='바뀐 항목 '+n+'개';$('saveBtn').disabled=n===0;}
async function saveStock(){
  const m=$('machSel').value; const ch=changes();
  if(!ch.length) return;
  if(!confirm(ch.length+'개 항목을 실제 기계('+m+')에 반영합니다. 계속할까요?')) return;
  const b=$('saveBtn'); b.disabled=true; b.textContent='저장 중…';
  try{ await pywebview.api.save_stock(m, ch); }catch(e){}
  b.textContent='저장';
  await loadStock(true);
  switchTab('log');
}
</script>
</body></html>
