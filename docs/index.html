<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16181D">
<title>한강라면 천안단대로드점 매출</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F3F4F6; --surface:#FFFFFF; --ink:#16181D; --muted:#6A7180;
    --line:#E6E8EC; --accent:#E8452C; --accent-soft:#FCEAE7;
    --pos:#0F9D58; --neg:#E8452C; --track:#EEF0F3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:460px; margin:0 auto; padding:14px 16px 40px; padding-bottom:calc(40px + env(safe-area-inset-bottom));}

  /* header */
  .top{display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 16px;}
  .store{font-size:20px; font-weight:800; letter-spacing:-0.02em;}
  .store small{display:block; font-size:13.5px; font-weight:600; color:var(--muted); letter-spacing:0; margin-top:2px;}
  .live{font-size:11px; font-weight:700; color:var(--muted);}
  .topright{display:flex; align-items:center; gap:8px;}
  .refresh{border:1px solid var(--line); background:var(--surface); color:var(--muted); width:32px; height:32px; border-radius:9px; font-size:17px; line-height:1; cursor:pointer; font-family:inherit; padding:0;}
  .refresh:active{background:var(--accent-soft); color:var(--accent);}
  .refresh.spin{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* segmented */
  .seg{display:flex; background:#E9EBEF; border-radius:11px; padding:3px; gap:3px; margin-bottom:14px;}
  .seg button{flex:1; border:0; background:transparent; padding:9px 0; font-size:15.5px; font-weight:700;
    color:var(--muted); border-radius:8px; cursor:pointer; transition:background .15s,color .15s; font-family:inherit;}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,24,33,.12);}
  .seg.underline{background:transparent; padding:0; border-bottom:1px solid var(--line); border-radius:0; gap:0; margin-bottom:14px;}
  .seg.underline button{flex:1; padding:9px 0; background:transparent; color:var(--muted); font-weight:500; border-radius:0; box-shadow:none; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .seg.underline button.on{background:transparent; color:var(--accent); box-shadow:none; border-bottom-color:var(--accent); font-weight:800;}

  /* hero */
  .hero{background:var(--ink); color:#fff; border-radius:18px; padding:20px 20px 18px; margin-bottom:8px;}
  .hero .lab{font-size:14.5px; font-weight:600; color:#B9BEC9;}
  .hero .big{font-size:46px; font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin:6px 0 2px;}
  .hero .big span{font-size:24px; font-weight:700; margin-left:2px; color:#D6DAE2;}
  .hero .sub{display:flex; align-items:center; gap:10px; font-size:14.5px; color:#B9BEC9; margin-top:8px;}
  .delta{display:inline-flex; align-items:center; gap:3px; font-weight:800; padding:2px 8px; border-radius:20px; font-size:12px;}
  .delta.up{background:rgba(15,157,88,.18); color:#5FE0A3;}
  .delta.down{background:rgba(232,69,44,.20); color:#FF9A8A;}
  .delta.flat{background:rgba(255,255,255,.12); color:#C7CCD5;}

  /* chips */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:14px 2px 4px; margin:0 -2px 2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    padding:7px 14px; border-radius:20px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  /* section */
  .sec{margin-top:26px;}
  .sec-h{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 12px;}
  .sec-h h2{font-size:17.5px; font-weight:800; margin:0; letter-spacing:-0.01em;}
  .sec-h .note{font-size:13px; color:var(--muted); font-weight:600;}

  /* column chart */
  .colchart{display:flex; align-items:flex-end; gap:5px; height:132px; padding:0 2px;}
  .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; cursor:pointer;}
  .col .bar{width:100%; max-width:22px; background:#BFC7D1; border-radius:5px 5px 3px 3px; transition:background .15s; min-height:4px;}
  .col.sel .bar, .col:active .bar{background:var(--accent);}
  .col.today .bar{background:#F6A99C;}
  .col.today.sel .bar{background:var(--accent);}
  .xlabels{display:flex; gap:5px; margin-top:7px; padding:0 2px;}
  .xlabels span{flex:1; text-align:center; font-size:11.5px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .readout{display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 12px; min-height:20px;}
  .readout .d{font-size:13.5px; color:var(--muted); font-weight:600;}
  .readout .v{font-size:16.5px; font-weight:800;}

  /* horizontal bars */
  .hrow{display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:10px; padding:9px 2px;}
  .hrow + .hrow{border-top:1px solid var(--line);}
  .hrow .name{font-size:15.5px; font-weight:700;}
  .hrow .track{height:9px; background:var(--track); border-radius:6px; overflow:hidden;}
  .hrow .fill{height:100%; background:var(--accent); border-radius:6px;}
  .hrow .amt{font-size:15.5px; font-weight:800; white-space:nowrap; text-align:right;}
  .hrow .amt em{display:block; font-style:normal; font-size:12.5px; color:var(--muted); font-weight:600;}

  /* product list */
  .prow{display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:10px; padding:10px 2px;}
  .prow + .prow{border-top:1px solid var(--line);}
  .prow .rk{font-size:16px; font-weight:800; color:var(--muted); text-align:center;}
  .prow .rk.top{color:var(--accent);}
  .prow .pn{font-size:16px; font-weight:700;}
  .prow .pn em{display:block; font-style:normal; font-size:13px; color:var(--muted); font-weight:600; margin-top:1px;}
  .prow .pa{font-size:16px; font-weight:800; white-space:nowrap;}
  .gtabs{display:flex; gap:6px; margin:0 0 12px; overflow-x:auto; scrollbar-width:none;}
  .gtabs::-webkit-scrollbar{display:none;}
  .gtab{flex:1 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:8px 14px; border-radius:9px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .gtab.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .gempty{text-align:center; color:var(--muted); font-size:14.5px; padding:24px 0;}

  /* data entry */
  details.entry{margin-top:30px; border-top:1px solid var(--line); padding-top:16px;}
  details.entry summary{list-style:none; cursor:pointer; font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:6px;}
  details.entry summary::-webkit-details-marker{display:none;}
  details.entry summary .plus{color:var(--accent); font-size:18px; line-height:1;}
  .entry-body{margin-top:14px;}
  .entry-body p{font-size:13.5px; color:var(--muted); margin:0 0 12px; line-height:1.5;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  select, textarea{width:100%; font-family:inherit; font-size:15.5px; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:var(--surface); color:var(--ink);}
  textarea{min-height:110px; resize:vertical; line-height:1.5;}
  select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent);}
  .btns{display:flex; gap:8px; margin-top:4px;}
  .btn{flex:1; border:0; border-radius:11px; padding:12px 0; font-size:15.5px; font-weight:800; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:#EEF0F3; color:var(--ink); flex:0 0 auto; padding:12px 16px;}
  .msg{font-size:12.5px; font-weight:700; margin-top:10px; min-height:16px;}
  .msg.ok{color:var(--pos);} .msg.err{color:var(--neg);}

  .empty{text-align:center; padding:38px 12px; color:var(--muted);}
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px;}
  .lowalert{background:#FDECEA; border-radius:12px; padding:12px 14px; margin-bottom:16px;}
  .lowalert .la-h{font-size:13.5px; font-weight:800; color:var(--accent); margin-bottom:6px;}
  .lowalert .la-b{font-size:13px; color:#B23A28; line-height:1.6;}
  .strow{display:grid; grid-template-columns:1fr 90px 56px; align-items:center; gap:10px; padding:9px 2px;}
  .strow + .strow{border-top:0.5px solid var(--line);}
  .strow .sp{font-size:15px; font-weight:500;}
  .strow .strack{height:8px; background:var(--track); border-radius:5px; overflow:hidden;}
  .strow .sfill{height:100%; border-radius:5px;}
  .strow .sq{font-size:15px; font-weight:800; text-align:right; white-space:nowrap;}
  .foot{text-align:center; font-size:11px; color:var(--muted); margin-top:28px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="store">한강라면<small id="mcount">천안단대로드점</small></div>
    <div class="topright">
      <div class="live">샘플 데이터</div>
      <button id="refreshBtn" class="refresh" title="새로고침">↻</button>
    </div>
  </div>

  <div class="seg" id="topseg" style="margin-bottom:10px;">
    <button data-v="sales" class="on">매출</button>
    <button data-v="stock">재고</button>
  </div>

  <div class="seg underline" id="seg">
    <button data-p="day" class="on">일별</button>
    <button data-p="month">월별</button>
  </div>
  <select id="monthSel" style="display:none; width:100%; margin:-4px 0 14px; font-family:inherit; font-size:15.5px; font-weight:700; border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:var(--surface); color:var(--ink);"></select>

  <div class="hero">
    <div class="lab" id="heroLab">오늘 매출</div>
    <div class="big" id="heroTotal">0<span>원</span></div>
    <div class="sub">
      <span id="heroCount">0건</span>
      <span id="heroDelta" class="delta flat">–</span>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div id="content"></div>

  <div class="foot">
    매시간 자동으로 갱신돼요 · 홈 화면에 추가하면 앱처럼 쓸 수 있어요
  </div>
</div>

<script>
let MACHINES = ["라면1","라면2","냉동","냉장","슬림"];
const MENU = [
  ["신라면",4000,1.6],["진라면(매운맛)",4000,1.3],["참깨라면",4000,1.4],["삼양라면",3500,1.2],
  ["너구리",4000,1.0],["짜파게티",4000,1.1],["진짬뽕",4000,0.9],["오징어짬뽕",4000,0.8],
  ["불닭볶음면",4000,1.2],["무파마",4000,0.7],["멸치칼국수",4000,0.6],["진쫄뽕",4000,0.7]
];
let TX = [];            // {machine, product, amount, date:"YYYY-MM-DD", time:"HH:MM"}
let period = "day";     // day | month
let selDay = "";        // "YYYY-MM-DD" selected in 일별 tab
let selMonth = "";      // "YYYY-MM" when viewing a specific month
let prodGroup = "전체";  // 잘나가는 상품 그룹 탭
const PGROUPS = [["전체",["라면1","라면2","냉동","냉장","슬림"]],["라면",["라면1","라면2"]],["냉동",["냉동"]],["냉장",["냉장"]],["슬림",["슬림"]]];
let machFilter = "전체";
let selCol = null;
let view = "sales";     // sales | stock
const LOW = 5;          // 재고 이하면 '곧 떨어짐' 경고

/* ---------- storage (persist across sessions when available) ---------- */
const DATA_URLS = [
  "https://raw.githubusercontent.com/9gunmo-alt/hangang/main/docs/data.json",
  "./data.json"
];
async function pullData(){
  // 노트북 봇이 올린 최신을 raw 주소에서 먼저(즉시 반영), 실패하면 Pages 사본에서
  for(const base of DATA_URLS){
    try{
      const res = await fetch(base+"?ts="+Date.now(), {cache:"no-store"});
      if(res.ok){
        const j = await res.json();
        if(Array.isArray(j.machines) && j.machines.length) MACHINES = j.machines;
        TX = (j.transactions||[]).map(function(t){
          return {machine:t.machine, product:cleanName(t.product), amount:t.amount,
                  date:(t.datetime||"").slice(0,10), time:(t.datetime||"").slice(11,16)};
        });
        window.__auto = true; window.__updated = j.generated_at || null;
        window.__stockData = j.stock || {};
        return true;
      }
    }catch(e){}
  }
  return false;
}
async function load(){
  if(await pullData()) return;
  // 파일로 직접 열었거나 아직 수집 전 → 저장된/샘플 데이터
  try{
    if(window.storage){
      const r = await window.storage.get("txns");
      if(r && r.value){ TX = JSON.parse(r.value); return; }
    }
  }catch(e){}
  TX = seed();
  save();
}
async function save(){
  try{ if(window.storage) await window.storage.set("txns", JSON.stringify(TX)); }catch(e){}
}

/* ---------- sample data ---------- */
function seed(){
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  const popular=[1.5,1.1,0.9,1.3,0.7]; // per-machine traffic
  for(let d=59; d>=0; d--){
    const day=new Date(today); day.setDate(today.getDate()-d);
    const wknd=(day.getDay()===0||day.getDay()===6)?1.35:1;
    MACHINES.forEach((m,mi)=>{
      let n=Math.round((6+Math.random()*10)*popular[mi]*wknd);
      if(d===0) n=Math.round(n*0.6); // partial today
      for(let i=0;i<n;i++){
        const item=weighted(MENU);
        const hh=String(Math.floor(Math.random()*24)).padStart(2,"0");
        const mm=String(Math.floor(Math.random()*60)).padStart(2,"0");
        out.push({machine:m, product:item[0], amount:item[1], date:fmtD(day), time:hh+":"+mm});
      }
    });
  }
  return out;
}
function weighted(list){
  const tot=list.reduce((s,x)=>s+x[2],0); let r=Math.random()*tot;
  for(const x of list){ r-=x[2]; if(r<=0) return x; } return list[0];
}

/* ---------- helpers ---------- */
function fmtD(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function won(n){return n.toLocaleString("ko-KR");}
function fmtUpdated(iso){try{var d=new Date(iso);var p=function(x){return String(x).padStart(2,"0");};return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}catch(e){return "";}}
function cleanName(s){return (s||"").replace(/외\s*\d+\s*개\s*$/,"").trim()||"(상품)";}
function todayStr(){const t=new Date();return fmtD(t);}
function thisMonth(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");}
function filtered(){return machFilter==="전체"?TX:TX.filter(t=>t.machine===machFilter);}
function prevMonth(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;if(m===0){m=12;y--;}return y+"-"+String(m).padStart(2,"0");}
function monthLabel(ym){return (+ym.slice(5,7))+"월";}
function dayLabel(d){return (+d.slice(5,7))+"월 "+(+d.slice(8,10))+"일";}
function scopeMonth(){return selMonth||thisMonth();}
function availableMonths(){var set={};TX.forEach(function(r){if(r.date)set[r.date.slice(0,7)]=1;});set[thisMonth()]=1;return Object.keys(set).sort().reverse();}
function monthDayList(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);var last=new Date(y,m,0).getDate();var out=[];for(var d=1;d<=last;d++){out.push(ym+"-"+String(d).padStart(2,"0"));}return out;}

/* ---------- 재고 보기 ---------- */
function stockView(){
  const data = window.__stockData || {};
  const machines = (machFilter==="전체") ? MACHINES : [machFilter];
  let low=[];
  machines.forEach(m=>{(data[m]||[]).forEach(it=>{ const mx=it.max||it.qty||1; if(it.qty<=Math.max(1,Math.round(mx*0.2))) low.push(it.product+" ("+m+")"); });});
  let html="";
  if(low.length){
    html += `<div class="lowalert"><div class="la-h">⚠ 곧 떨어질 상품 ${low.length}개</div><div class="la-b">${low.join(" · ")}</div></div>`;
  }
  machines.forEach(m=>{
    const items=(data[m]||[]).slice().sort((a,b)=>a.qty-b.qty);
    if(!items.length) return;
    html += `<div class="sec"><div class="sec-h"><h2>${m}</h2><span class="note">${items.length}개 상품</span></div>`;
    html += items.map(it=>{
      const mx=it.max||it.qty||1;
      const lo=(mx>0)&&(it.qty<=Math.max(1,Math.round(mx*0.2)));
      const pct=Math.max(3,Math.round(it.qty/mx*100));
      return `<div class="strow">
        <div class="sp">${it.product}</div>
        <div class="strack"><div class="sfill" style="width:${pct}%; background:${lo?'var(--neg)':'var(--accent)'}"></div></div>
        <div class="sq" style="${lo?'color:var(--neg)':''}">${it.qty}<span style="font-size:12px;color:var(--muted);font-weight:400"> / ${mx}</span></div>
      </div>`;
    }).join("");
    html += `</div>`;
  });
  if(!html) html = `<div class="empty"><b>재고 데이터가 아직 없어요</b>로봇이 재고를 읽으면 채워져요 (최대 15분). 잠시 뒤 새로고침 해보세요.</div>`;
  return html;
}

/* ---------- render ---------- */
function render(){
  document.getElementById("mcount").textContent="천안단대로드점";
  var liveEl=document.querySelector(".live");
  if(liveEl && window.__auto){ liveEl.textContent = window.__updated ? ("업데이트 "+fmtUpdated(window.__updated)) : "자동 수집"; }

  var isStock=(view==="stock");
  document.getElementById("seg").style.display=isStock?"none":"flex";
  document.querySelector(".hero").style.display=isStock?"none":"block";
  document.querySelectorAll("#topseg button").forEach(function(x){x.classList.toggle("on",x.dataset.v===view);});

  renderChips();
  renderMonthSel();

  if(isStock){
    document.getElementById("content").innerHTML = stockView();
    return;
  }

  if(TX.length===0){ renderEmpty(); renderHero(0,0,null); return; }
  const rows=filtered();

  // hero
  let cur,prev,curCnt;
  if(period==="day"){
    if(!selDay) selDay=todayStr();
    const d=selDay; const y=fmtD(new Date(new Date(d+"T00:00").getTime()-864e5));
    const c=rows.filter(r=>r.date===d); const p=rows.filter(r=>r.date===y);
    cur=sum(c); curCnt=c.length; prev=sum(p);
    document.getElementById("heroLab").textContent=(d===todayStr()?"오늘":dayLabel(d))+" 매출";
  }else{
    const cm=scopeMonth(); const lm=prevMonth(cm);
    const c=rows.filter(r=>r.date.startsWith(cm)); const p=rows.filter(r=>r.date.startsWith(lm));
    cur=sum(c); curCnt=c.length; prev=sum(p);
    document.getElementById("heroLab").textContent=cm.slice(0,4)+"년 "+monthLabel(cm)+" 매출";
  }
  renderHero(cur,curCnt,prev);

  // sections — 일별: 일별그래프+기계별 / 월별: 월별그래프+기계별+상품
  const html = (period==="day")
    ? dailySec(rows) + machineSec()
    : monthlySec(rows) + machineSec() + productSec(rows);
  document.getElementById("content").innerHTML = html;
  wireCharts(rows);
}
function sum(a){return a.reduce((s,r)=>s+r.amount,0);}
function renderMonthSel(){
  var sel=document.getElementById("monthSel"); if(!sel) return;
  sel.style.display=(period==="month" && view!=="stock")?"block":"none";
  if(period!=="month" || view==="stock") return;
  var months=availableMonths();
  if(!selMonth || months.indexOf(selMonth)<0) selMonth=months[0]||thisMonth();
  sel.innerHTML=months.map(function(m){return '<option value="'+m+'"'+(m===selMonth?' selected':'')+'>'+m.slice(0,4)+'년 '+monthLabel(m)+'</option>';}).join("");
  sel.onchange=function(){ selMonth=sel.value; selCol=null; render(); };
}

function renderHero(cur,cnt,prev){
  document.getElementById("heroTotal").innerHTML=won(cur)+"<span>원</span>";
  document.getElementById("heroCount").textContent=cnt.toLocaleString("ko-KR")+"건 · "+(machFilter==="전체"?MACHINES.length+"대":machFilter);
  const el=document.getElementById("heroDelta");
  if(prev==null||prev===0){ el.className="delta flat"; el.textContent=period==="day"?"전일 기록 없음":"지난달 기록 없음"; return; }
  const pct=Math.round((cur-prev)/prev*100);
  const lab=period==="day"?"전일":"지난달";
  if(pct>0){el.className="delta up"; el.textContent="▲ "+pct+"% "+lab;}
  else if(pct<0){el.className="delta down"; el.textContent="▼ "+Math.abs(pct)+"% "+lab;}
  else{el.className="delta flat"; el.textContent="0% "+lab;}
}

function renderChips(){
  const c=document.getElementById("chips");
  const list=["전체",...MACHINES];
  c.innerHTML=list.map(m=>`<button class="chip ${m===machFilter?'on':''}" data-m="${m}">${m}</button>`).join("");
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{machFilter=b.dataset.m; selCol=null; render();});
}

function renderEmpty(){

}

/* daily column chart — 오늘 보기: 최근 2주 / 월별 보기: 그 달 전체 */
function dailySec(rows){
  const days=[]; const base=new Date(); base.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(base); d.setDate(base.getDate()-i); days.push(fmtD(d));}
  const vals=days.map(dt=>sum(rows.filter(r=>r.date===dt)));
  const max=Math.max(1,...vals);
  const t=todayStr();
  const cols=days.map((dt,i)=>{
    const h=Math.round(vals[i]/max*100);
    const cls=(dt===t?"today ":"")+(dt===selDay?"sel":"");
    return `<div class="col ${cls}" data-i="${i}" data-date="${dt}" data-val="${vals[i]}">
      <div class="bar" style="height:${h}%"></div></div>`;
  }).join("");
  const labels=days.map((dt,i)=> (i%2===0)? `<span>${(+dt.slice(8,10))}</span>`:`<span></span>`).join("");
  const selVal=sum(rows.filter(r=>r.date===selDay));
  return `<div class="sec"><div class="sec-h"><h2>일별 매출</h2><span class="note">최근 2주</span></div>
    <div class="readout" id="dReadout"><span class="d">${selDay===t?"오늘":dayLabel(selDay)} (${weekday(selDay)})</span><span class="v">${won(selVal)}원</span></div>
    <div class="colchart" id="dChart">${cols}</div><div class="xlabels">${labels}</div></div>`;
}

/* monthly column chart — last 6 months */
function monthlySec(rows){
  const months=[]; const b=new Date(); b.setDate(1);
  for(let i=5;i>=0;i--){const d=new Date(b); d.setMonth(b.getMonth()-i); months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}
  const vals=months.map(m=>sum(rows.filter(r=>r.date.startsWith(m))));
  const max=Math.max(1,...vals);
  const cm=(period==="month")?scopeMonth():thisMonth();
  const cols=months.map((m,i)=>{
    const h=Math.round(vals[i]/max*100);
    return `<div class="col ${m===cm?'today':''}" data-i="${i}" data-mon="${m}" data-val="${vals[i]}">
      <div class="bar" style="height:${h}%"></div></div>`;
  }).join("");
  const labels=months.map(m=>`<span>${parseInt(m.slice(5))}월</span>`).join("");
  return `<div class="sec"><div class="sec-h"><h2>월별 매출</h2><span class="note">최근 6개월</span></div>
    <div class="readout" id="mReadout"><span class="d">${period==="month"?"막대를 누르면 그 달로 이동":"막대를 누르면 그 달 매출이 보여요"}</span><span class="v"></span></div>
    <div class="colchart" id="mChart">${cols}</div><div class="xlabels">${labels}</div></div>`;
}

/* per-machine — respects the current period, always shows all 5 */
function machineSec(){
  const mon=scopeMonth();
  const inScope=(r)=> period==="day"? r.date===selDay : r.date.startsWith(mon);
  const data=MACHINES.map(m=>({m, v:sum(TX.filter(r=>r.machine===m && inScope(r))), c:TX.filter(r=>r.machine===m && inScope(r)).length}));
  const max=Math.max(1,...data.map(d=>d.v));
  const rows=data.map(d=>`<div class="hrow">
      <div class="name">${d.m}</div>
      <div class="track"><div class="fill" style="width:${Math.round(d.v/max*100)}%"></div></div>
      <div class="amt">${won(d.v)}원<em>${d.c}건</em></div></div>`).join("");
  const note = period==="day" ? (selDay===todayStr()?"오늘":dayLabel(selDay)) : monthLabel(mon);
  return `<div class="sec"><div class="sec-h"><h2>기계별 매출</h2><span class="note">${note}</span></div>${rows}</div>`;
}

/* top products — 그룹 탭(슬림·라면·냉장·냉동)으로 구분 */
function productSec(rows){
  const mon=scopeMonth();
  const inScope=(r)=> r.date.startsWith(mon);
  const grp=PGROUPS.find(g=>g[0]===prodGroup)||PGROUPS[0];
  const scoped=TX.filter(r=>inScope(r) && grp[1].indexOf(r.machine)>=0);
  const map={};
  scoped.forEach(r=>{ if(!map[r.product]) map[r.product]={c:0,v:0}; map[r.product].c++; map[r.product].v+=r.amount; });
  const arr=Object.entries(map).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.c-a.c).slice(0,8);
  const tabs=PGROUPS.map(g=>`<button class="gtab ${g[0]===prodGroup?'on':''}" data-g="${g[0]}">${g[0]}</button>`).join("");
  const body=arr.length
    ? arr.map((p,i)=>`<div class="prow">
        <div class="rk ${i===0?'top':''}">${i+1}</div>
        <div class="pn">${p.name}<em>${p.c}개 판매</em></div>
        <div class="pa">${won(p.v)}원</div></div>`).join("")
    : `<div class="gempty">${monthLabel(mon)} 판매 내역이 없어요</div>`;
  return `<div class="sec"><div class="sec-h"><h2>잘 나가는 상품</h2><span class="note">${monthLabel(mon)}</span></div>
    <div class="gtabs">${tabs}</div>${body}</div>`;
}

function wireCharts(rows){
  const dc=document.getElementById("dChart");
  if(dc){ dc.querySelectorAll(".col").forEach(c=>c.onclick=()=>{
    selDay=c.dataset.date; render();
  });}
  const mc=document.getElementById("mChart");
  if(mc){ mc.querySelectorAll(".col").forEach(c=>c.onclick=()=>{
    if(period==="month"){
      selMonth=c.dataset.mon; selCol=null; render();
    } else {
      mc.querySelectorAll(".col").forEach(x=>x.classList.remove("sel")); c.classList.add("sel");
      const r=document.getElementById("mReadout");
      r.querySelector(".d").textContent=parseInt(c.dataset.mon.slice(5))+"월";
      r.querySelector(".v").textContent=won(+c.dataset.val)+"원";
    }
  });}
  document.querySelectorAll(".gtab").forEach(b=>b.onclick=()=>{ prodGroup=b.dataset.g; render(); });
}
function weekday(dt){return ["일","월","화","수","목","금","토"][new Date(dt).getDay()];}

/* ---------- data entry ---------- */
function parsePaste(text, machine){
  const dtRe=/(\d{2})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/;
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    const m=line.match(dtRe); if(!m) return;
    const date="20"+m[1]+"-"+m[2]+"-"+m[3];
    const time=String(m[4]).padStart(2,"0")+":"+m[5];
    const before=line.slice(0,m.index).trim();
    const am=before.match(/([\d,]{2,})\s*원?\s*$/); if(!am) return;
    const amount=parseInt(am[1].replace(/,/g,""),10); if(!amount) return;
    let product=before.slice(0,am.index).replace(/^(거래승인|승인|거래취소|취소)\s*/,"").trim();
    product=cleanName(product);
    out.push({machine, product, amount, date, time});
  });
  return out;
}

/* 새로고침: 버튼 · 앱 다시 볼 때 · 주기적으로 */
let __refreshing=false;
async function doRefresh(){
  if(__refreshing) return; __refreshing=true;
  const b=document.getElementById("refreshBtn"); if(b) b.classList.add("spin");
  await pullData(); render();
  if(b) setTimeout(()=>b.classList.remove("spin"),400);
  __refreshing=false;
}
document.getElementById("refreshBtn").onclick=doRefresh;
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) doRefresh(); });
window.addEventListener("focus",doRefresh);
setInterval(()=>{ if(!document.hidden) doRefresh(); }, 180000); // 3분마다

(async function(){ await load(); render(); })();
