name: 매출 수집

on:
  schedule:
    - cron: "*/10 * * * *"    # 10분마다 (GitHub 스케줄은 다소 지연될 수 있음)
  workflow_dispatch:            # 버튼으로 수동 실행도 가능

# data.json 을 커밋해서 GitHub Pages 로 올리기 위한 권한
permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 매출 수집
        run: python scraper/scrape.py

      - name: data.json 커밋
        run: |
          git config user.name "sales-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "매출 갱신 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
